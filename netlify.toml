[build]
  # The directory where dependencies and package.json are located
  base = ""
  # The command to install and build the static assets
  command = "npm run build"
  # The directory that contains the compiled output files
  publish = "dist"

# The Firebase web config is public by design — it is meant to ship in the
# browser bundle — so tell Netlify's secret scanner these values are expected.
# STRIPE_WEBHOOK_SECRET and META_CAPI_ACCESS_TOKEN are deliberately NOT listed:
# they are real secrets and must never appear in build output.
[build.environment]
  SECRETS_SCAN_OMIT_KEYS = "VITE_FIREBASE_API_KEY,VITE_FIREBASE_AUTH_DOMAIN,VITE_FIREBASE_PROJECT_ID,VITE_FIREBASE_STORAGE_BUCKET,VITE_FIREBASE_MESSAGING_SENDER_ID,VITE_FIREBASE_APP_ID"

# Serverless function (the Stripe webhook). Runs only when called; free tier.
[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Clean URL for the webhook. Must come BEFORE the SPA catch-all below so it is
# not swallowed by the /* rewrite.
[[redirects]]
  from = "/api/stripe-webhook"
  to = "/.netlify/functions/stripe-webhook"
  status = 200

# Setup redirect rules for Single Page Applications (SPA)
# This ensures that deep links work properly if routes are implemented
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
